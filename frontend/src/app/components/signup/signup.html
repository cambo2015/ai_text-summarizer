<div class="d-flex justify-content-center align-items-center  vh-100 my-auto bg-image h-100">
    <div class="bg-white mx-md-auto  p-3 shadow rounded bg-dark" style="max-width: 400px">
        <!-- <div class="grape-logo">
            
        </div> -->
        <div class="d-flex justify-content-center rounded flex-column w-100"
            style="height:120px;position:relative;top:-50px;">

            <div class="my-2 mx-0 align-self-center shadow rounded bg-primary d-flex justify-content-center p-2"
                style=" width:300px; ">
                <i class="bg-white grape-icon m-1 fs-2 bi bi-lock-fill text-primary"></i>

            </div>
            <h1 class="text-center  fs-3 text-white" style="position:relative; top:-60px; ">Signup </h1>

        </div>

        <form [formGroup]="signupFormGroup" (ngSubmit)="onSubmit()"
            [class.has-auth-error]="signupFormGroup.errors?.['authFailed']" class="p-4 rounded shadow  bg-error">

            <!-- email -->
            <div class="rounded">
                <div class="input-group my-1 d-flex">
                    <label class="bg-white text-primary input-group-text">
                        Email: <i class="bi bi-envelope-fill text-primary fs-5 ms-auto"></i>
                    </label>
                    <input class="form-control" formControlName="username" type="text">
                </div>


                <div *ngIf="username?.invalid && (username?.dirty || username?.touched)"
                    class="alert alert-danger mt-1">
                    <div *ngIf="username?.errors?.['required']">
                        Email is required
                    </div>
                    <div *ngIf="username?.errors?.['pattern']">
                        Email must be a valid email address format
                    </div>
                </div>
                
            </div>

            <!-- password -->
            <div class=" rounded">
                <div class="input-group my-3 d-flex">
                    <label class="bg-white text-primary input-group-text">Password: <i
                            class="bi bi-key-fill text-primary  fs-5 ms-auto"></i></label>
                    <input class="form-control" formControlName="password" type="password">
                </div>


                <div *ngIf="password?.invalid && (password?.dirty || password?.touched)"
                    class="alert alert-danger mt-1">
                    <div *ngIf="password?.errors?.['required']">
                        password is required
                    </div>
                    <div *ngIf="password?.errors?.['minlength']">
                        
                        Password must be at least <b>8 characters</b> long 
                    </div>
                    <div *ngIf="password?.errors?.['pattern']" >
                        Password must contain at least one:
                        <ul >
                            <li><b>uppercase letter</b></li>
                            <li><b>lowercase letter</b></li>
                            <li><b>number</b></li>
                            <li><b>special character</b></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class=" w-100 d-flex justify-content-center">
                <button class="btn btn-primary my-2 text-white" type="submit" [disabled]="loading">Sumbit 
                    <i *ngIf="!loading" class="bi bi-send-fill ms-1 text-white"></i>
                    <app-spinner *ngIf="loading" size="lg" color="light" class="ms-2" size="sm"></app-spinner>
                    </button>
            </div>
        </form>
        <div *ngIf="authError" class="alert alert-danger my-2" aria-live="polite">
            {{ authError }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success mt-1">
            {{ successMessage }}
        </div>

    </div>
</div>
